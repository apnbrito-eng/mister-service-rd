<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atención y clientes — ensayo unificado</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#18344f;font:15px system-ui}header{padding:18px 24px;background:white;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}p{color:#67788a;line-height:1.5}button,input{font:inherit}button{cursor:pointer;background:white;border:1px solid #d6e0ea;border-radius:10px;padding:11px;color:#18344f}.active{background:#18344f;color:white}main{padding:20px}.shell{max-width:1100px;margin:auto;background:white;border:1px solid #dce4ec;border-radius:20px;overflow:hidden}.shell.mobile{width:390px;max-width:100%}.title{padding:20px;border-bottom:1px solid #e6edf3}.title p{margin:6px 0 0;font-size:13px}.tabs{display:flex;padding:12px;gap:6px;background:#f8fafc}.tabs button{flex:1;padding:11px 6px;font-size:14px}.layout{display:grid;grid-template-columns:300px 1fr;min-height:510px}.list{padding:16px;border-right:1px solid #e4eaf0}.list input{width:100%;padding:12px;border:1px solid #d7e1eb;border-radius:10px;margin-bottom:14px}.person{display:block;text-align:left;width:100%;margin-bottom:10px;padding:16px}.person small{display:block;margin-top:7px;opacity:.8}.detail{padding:24px;min-width:0}.detail h2{margin:4px 0}.badge{font-size:12px;color:#7d5c16;background:#fff3d2;padding:5px 9px;border-radius:6px}.card{padding:18px;border:1px solid #e0e7ee;border-radius:14px;margin-top:16px}.bubble{padding:14px;background:#f0f4f7;border-radius:14px;max-width:85%;margin-top:20px}.bubble.out{margin-left:auto;background:#d9fbd5}.subtabs{display:flex;gap:8px;margin-top:22px}.subtabs button{flex:1}.back{display:none;margin-bottom:18px}.mobile .layout{display:block}.mobile .list{border-right:0}.mobile.chosen .list{display:none}.mobile:not(.chosen) .detail{display:none}.mobile .back{display:block}.hint{max-width:1100px;margin:0 auto 16px;font-size:14px}.mobile .detail{padding:18px}.note{font-size:13px;margin-top:20px} @media(max-width:620px){header{display:block}header div{margin-top:12px}main{padding:10px}}</style><header><h1>Atención y clientes · ensayo</h1><div><button id="mob" onclick="mode(true)">Móvil</button> <button id="desk" class="active" onclick="mode(false)">Web</button></div></header><main><p class="hint">Datos ficticios. Prueba seleccionar un cliente y cambiar de pestaña: la selección se conserva.</p><div id="shell" class="shell"><div class="title"><b>Atención y clientes</b><p>Conversaciones, ficha y solicitudes en un mismo lugar <span class="badge">Ensayo</span></p></div><div class="tabs"><button id="tab0" class="active" onclick="tab(0)">Conversaciones</button><button id="tab1" onclick="tab(1)">Clientes</button><button id="tab2" onclick="tab(2)">Solicitudes</button></div><div class="layout"><aside class="list"><input placeholder="Buscar cliente" oninput="search(this.value)"><div id="people"></div></aside><article class="detail"><button class="back" onclick="document.getElementById('shell').classList.remove('chosen')">← Volver a la lista</button><h2 id="name"></h2><p id="context">Cliente seleccionado · datos de ejemplo</p><div id="content"></div></article></div></div></main><script>const names=['Ana · ejemplo','Luis · ejemplo'];let selected=0,current=0,citas=false;function mode(m){document.getElementById('shell').classList.toggle('mobile',m);document.getElementById('mob').classList.toggle('active',m);document.getElementById('desk').classList.toggle('active',!m)}function search(q=''){document.getElementById('people').innerHTML=names.map((n,i)=>n.toLowerCase().includes(q.toLowerCase())?`<button class="person ${i===selected?'active':''}" onclick="choose(${i})">${n}<small>${i===0?'Consulta sobre lavadora':'Consulta sobre nevera'}</small></button>`:'').join('')}function choose(i){selected=i;document.getElementById('shell').classList.add('chosen');search();render()}function tab(i){current=i;for(let k=0;k<3;k++)document.getElementById('tab'+k).classList.toggle('active',i===k);render()}function sub(v){citas=v;render()}function render(){document.getElementById('name').textContent=names[selected];const equipment=selected===0?'lavadora':'nevera';let html='';if(current===0)html=`<div class="bubble">Hola, necesito revisar mi ${equipment}.</div><div class="bubble out">Podemos ayudarte. Revisaremos tu solicitud.</div><p class="note">Conversación de ejemplo · envío deshabilitado en este ensayo.</p><button onclick="tab(2)">Ver solicitudes de este cliente</button>`;if(current===1)html=`<div class="card"><b>Ficha del cliente</b><p>Equipo: ${equipment}<br>Contacto y ubicación: pendientes en este ejemplo.</p></div><div class="card"><b>Órdenes, garantías y notas</b><p>Aquí se consultaría el expediente del cliente seleccionado.</p></div><p><button onclick="tab(0)">Abrir conversación</button></p>`;if(current===2)html=`<div class="subtabs"><button class="${!citas?'active':''}" onclick="sub(false)">Recibidas</button><button class="${citas?'active':''}" onclick="sub(true)">Citas por confirmar</button></div><div class="card"><b>${citas?'Visita pendiente de confirmar':'Solicitud de revisión'}</b><p>${names[selected]} · ${equipment}</p><p>${citas?'Confirmación y agendamiento pendientes.':'Recibida desde formulario · pendiente de revisión.'}</p><span class="badge">Registro ficticio</span></div><p class="note">Vista vinculada al cliente seleccionado. El ensayo no confirma citas ni crea órdenes.</p>`;document.getElementById('content').innerHTML=html}search();render();</script></html>
