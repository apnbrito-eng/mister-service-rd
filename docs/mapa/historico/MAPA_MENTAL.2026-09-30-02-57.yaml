meta:
  proyecto: Mister Service RD
  descripcion: Software de gestión para taller de reparación de electrodomésticos en República Dominicana
  responsable_humano: Jorge Luis Brito García
  version_mapa: '1.1'
  ultima_actualizacion: '2026-09-29'
  estado: Candidata local verificada; no implica publicación ni migración de datos.
areas:
  ordenes:
    color: indigo
    descripcion: Ciclo de vida de la orden de servicio — el corazón del sistema
  agendamiento:
    color: azul
    descripcion: Calendarios, citas y mantenimientos preventivos
  clientes:
    color: amarillo
    descripcion: CRM del cliente final que paga la reparación
  dinero:
    color: verde
    descripcion: Cotizaciones, facturas, pagos, comisiones, nómina, gastos
  inventario:
    color: morado
    descripcion: Productos, piezas, equipos en el taller, movimientos de stock
  personal_rrhh:
    color: naranja
    descripcion: Empleados, usuarios, roles, ponches, cierres de día
  whatsapp_crm:
    color: teal
    descripcion: Inbox de WhatsApp, plantillas HSM, conversaciones y errores Meta
  formularios_publicos:
    color: rosa
    descripcion: Formularios públicos sin login, solicitudes que generan leads
  reporting:
    color: gris
    descripcion: Dashboards y métricas — lee de todo, no escribe
  sistema:
    color: neutro
    descripcion: 'Cross-cutting: auditoría, notificaciones, rate limits, configuración'
modulos:
  bancos:
    area: dinero
    descripcion: Catálogo de cuentas y proyección de cobros por cuenta, con período opcional y conciliación de incidencias
    depende_de:
      - ordenes_servicio
    expone_a: []
    colecciones_firestore:
      - bancos
      - ordenes_servicio
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Actualización local 2026-09-29. Historial lee sólo ordenes_servicio.pagos crudos por bancoId; nunca suma el espejo ni
      inventa fechas. Confirmados, pendientes e incidencias separados. Admin/coordinadora con bancosGestionar. No conecta al banco
      real ni ejecuta migración al abrir.
  ordenes_servicio:
    area: ordenes
    descripcion: 'Orden de servicio: crea, asigna, transiciona fases (nuevo_lead → cerrado), cierra con wizard. Spine del sistema.'
    responsable_humano: Coordinadora de servicio
    depende_de:
      - clientes
      - personal
      - calendarios
    expone_a:
      - cotizaciones
      - facturas
      - pagos
      - comisiones
      - garantias
      - citas_por_confirmar
      - mantenimiento
      - avances
      - standby_piezas
      - equipos_taller
    colecciones_firestore:
      - ordenes_servicio
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      parseOrden() en utils/index.ts es la lectura común. Hoy 3 caminos de creación (useOrdenCreateForm, Mantenimiento,
      solicitudes); sprint NUCLEO-CREAR-ORDEN-CENTRAL unifica.
  avances:
    area: personal_rrhh
    descripcion: Adelantos de dinero a empleados; descuento vinculado a la nómina
    depende_de:
      - personal
    expone_a:
      - nomina
    colecciones_firestore:
      - avances
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: 'Corrección del mapa: avances corresponde a dinero adelantado, según avances.service.ts; piezas usadas se registran aparte.'
  calendarios:
    area: agendamiento
    descripcion: Calendarios públicos por técnico (slots configurables, URL pública /cita/:calendarId)
    depende_de:
      - personal
    expone_a:
      - citas_por_confirmar
    colecciones_firestore:
      - calendarios
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: >-
      Candidata local: calendario público asignado a técnico, solicitud conservada hasta confirmación por oficina. Identidad por
      UID, sin inferir por nombre.
  citas_por_confirmar:
    area: agendamiento
    descripcion: Citas solicitadas (web pública o admin) pendientes de confirmar y volverse orden
    depende_de:
      - clientes
      - personal
      - calendarios
    expone_a:
      - ordenes_servicio
    colecciones_firestore:
      - citas_por_confirmar
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Candidata local P042: token por intento y propietario, commit orden+vínculo valida cita vigente, liberación condicional.
      Callback de garantía fallido conserva formulario/vínculo, sin éxito falso. Reuso exige origen, cliente y orden activa. Sin
      vencimiento automático.
  mantenimiento:
    area: agendamiento
    descripcion: Mantenimientos preventivos programados para clientes recurrentes
    depende_de:
      - clientes
      - personal
    expone_a:
      - ordenes_servicio
    colecciones_firestore:
      - mantenimiento
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: >-
      Candidata local P039: ocurrencia de mantenimiento idempotente, cliente real, responsable activo y alertas internas. Acceso
      al chat existente, sin envío externo automático.
  clientes:
    area: clientes
    descripcion: 'CRM del cliente final. Teléfono normalizado (RD: 10 dígitos sin código país).'
    responsable_humano: Secretaria / coordinadora
    depende_de: []
    expone_a:
      - ordenes_servicio
      - citas_por_confirmar
      - mantenimiento
      - cotizaciones
      - facturas
      - garantias
      - whatsapp_inbox
      - solicitudes
    colecciones_firestore:
      - clientes
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: 'Helpers canónicos: buscarClientePorTelefono, buscarOCrearCliente. Anti-duplicado por telefonoNormalizado.'
  garantias:
    area: clientes
    descripcion: Garantías de servicio. Reapertura aplica descuento 10% sobre piezas al técnico original.
    depende_de:
      - ordenes_servicio
      - facturas
      - clientes
    expone_a:
      - comisiones
    colecciones_firestore:
      - facturas
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: Fase A (59c5fb0) awaiting QA Jorge. Cazador P-024 protege regla nueva (no reintroducir anulación 100%).
  cotizaciones:
    area: dinero
    descripcion: Cotizaciones QT externas o vinculadas a una orden; aceptación y conversión a conduce trazables.
    depende_de:
      - clientes
      - ordenes_servicio
      - productos
    expone_a:
      - facturas
    colecciones_firestore:
      - cotizaciones
      - precios_servicios
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Candidata local P038: conversión idempotente y vínculo transaccional con orden/conduce; costos de comisión sólo utilizan
      cotización aceptada, nunca borrador/rechazada. Numeración centralizada.
  facturas:
    area: dinero
    descripcion: 'Conduces de Garantía (CG): documentos operativos; facturación fiscal ocurre fuera de este sistema.'
    depende_de:
      - cotizaciones
      - ordenes_servicio
      - clientes
    expone_a:
      - pagos
      - comisiones
      - garantias
    colecciones_firestore:
      - facturas
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Candidata local: vínculo cotización/orden/conduce transaccional y único. Pagos y stock conservan sus validaciones; emisión
      de una orden no recalcula ni duplica devengos del cierre.
  pagos:
    area: dinero
    descripcion: Pagos del cliente. Hoy viven en array orden.pagos; subcolección /pagos espejo post B-2.
    depende_de:
      - ordenes_servicio
    expone_a:
      - facturas
      - comisiones
    colecciones_firestore:
      - ordenes_servicio
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      B-2 (d4d6498) migró 16 órdenes a subcolección espejo. B-3 (cut-over + endurecer rules) espera QA Jorge. Helper:
      obtenerPagosDeOrden(orden).
  comisiones:
    area: dinero
    descripcion: Comisión del técnico por orden cerrada. Garantía aplica descuento 10% sobre piezas.
    depende_de:
      - ordenes_servicio
      - facturas
      - personal
    expone_a:
      - nomina
    colecciones_firestore:
      - comisiones
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Candidata local P041: resolver técnico único por UID/docID, devengo de cierre con ID estable y transacción. Conduce de orden
      refleja devengos existentes con ajuste firmado de garantía, excluyendo anuladas. Manual persiste conduce y comisiones
      juntos; intención de reintento dura mientras el modal está abierto.
  nomina:
    area: dinero
    descripcion: Nómina quincenal por empleado con comisiones, bonos, asistencia, avances y cuotas
    depende_de:
      - comisiones
      - personal
      - avances
      - prestamos_empleados
      - ponches
    expone_a: []
    colecciones_firestore:
      - liquidaciones_nomina
      - comisiones
      - avances
      - prestamos_empleados
      - personal
      - ordenes_servicio
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Candidata local: cierre transaccional, neto negativo bloqueado, incidencias por fecha o devengos duplicados requieren
      conciliación. Estado de Resultado lee snapshots cerrados por fin del período; sueldo actual es referencia/proyección.
  gastos:
    area: dinero
    descripcion: Gastos operativos del taller (no piezas).
    depende_de: []
    expone_a:
      - reportes
    colecciones_firestore:
      - gastos
    rutas_api: []
    integraciones_externas: []
    criticidad: baja
  productos:
    area: inventario
    descripcion: >-
      Catálogo de productos/piezas con stock y costo. Dos colecciones (productos + piezas_inventario) — deuda histórica a
      consolidar.
    depende_de: []
    expone_a:
      - cotizaciones
    colecciones_firestore:
      - productos
      - piezas_inventario
      - movimientos_inventario
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: Solo la conversión cotización→factura descuenta stock. PiezaFormModal del cierre NO descuenta — decisión Jorge pendiente.
  standby_piezas:
    area: inventario
    descripcion: Piezas en espera de llegada para una orden
    depende_de:
      - ordenes_servicio
      - suplidores
    expone_a: []
    colecciones_firestore:
      - standby_piezas
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: >-
      Candidata local: piezas vinculadas a orden y llegada con aviso para coordinar instalación. Reactivación humana revalida
      revisión del padre y piezas; no descontar inventario por inferencia.
  equipos_taller:
    area: inventario
    descripcion: Equipos físicamente en el taller (en reparación o en espera)
    depende_de:
      - ordenes_servicio
    expone_a: []
    colecciones_firestore:
      - equipos_taller
    rutas_api: []
    integraciones_externas: []
    criticidad: baja
  personal:
    area: personal_rrhh
    descripcion: 'Empleados del taller: técnicos, secretarias, coordinadoras, operarias, administradores'
    responsable_humano: Jorge / admin
    depende_de: []
    expone_a:
      - ordenes_servicio
      - comisiones
      - nomina
      - calendarios
      - mantenimiento
      - ponches
      - cierres_dia
      - whatsapp_inbox
    colecciones_firestore:
      - personal
      - usuarios
    rutas_api:
      - /api/admin/crear-usuario
    integraciones_externas:
      - firebase_auth
    criticidad: alta
    notas: >-
      Alta crea AMBOS docs (personal/{autoId} + usuarios/{uid}) — invariante P-004. Los dropdowns guardan uid, no doc id —
      invariante P-006.
  ponches:
    area: personal_rrhh
    descripcion: Registro de entrada/salida del personal (control de asistencia)
    depende_de:
      - personal
    expone_a:
      - nomina
      - cierres_dia
    colecciones_firestore:
      - ponches
    rutas_api: []
    integraciones_externas: []
    criticidad: baja
  cierres_dia:
    area: personal_rrhh
    descripcion: Cierre diario operativo del taller
    depende_de:
      - personal
      - ponches
    expone_a:
      - reportes
    colecciones_firestore:
      - cierres_dia
    rutas_api: []
    integraciones_externas: []
    criticidad: baja
  whatsapp_inbox:
    area: whatsapp_crm
    descripcion: Inbox de conversaciones de WhatsApp con clientes. Webhook entrante + send saliente + outbox idempotente.
    depende_de:
      - clientes
      - personal
      - plantillas_whatsapp
    expone_a:
      - ordenes_servicio
    colecciones_firestore:
      - whatsapp_conversaciones
      - whatsapp_mensajes_inbox
      - whatsapp_mensajes_outbox
      - whatsapp_config
      - whatsapp_errores_meta
    rutas_api:
      - /api/whatsapp/send
      - /api/whatsapp/webhook
      - /api/whatsapp/media-proxy
    integraciones_externas:
      - meta_whatsapp
    criticidad: alta
    notas: >-
      Ventana 24h, idempotency por tempId (P-017), HMAC SHA-256 en webhook (P-016). Tras WA-FIX-PLANTILLAS (0ab73c5) catálogo
      alineado con Meta.
  plantillas_whatsapp:
    area: whatsapp_crm
    descripcion: Catálogo de plantillas HSM aprobadas en Meta (4 con imagen branded). Vive en código, no en Firestore.
    depende_de: []
    expone_a:
      - whatsapp_inbox
    colecciones_firestore: []
    rutas_api: []
    integraciones_externas:
      - meta_whatsapp
    criticidad: alta
    notas: >-
      src/config/plantillasWhatsApp.ts. Imágenes en public/plantillas/. Spec autoritativa en
      docs/sprints/PLANTILLAS_META_SPEC_2026-05-25.md.
  conversaciones_ia:
    area: whatsapp_crm
    descripcion: >-
      Asistente interno del personal con permisos por rol; incorpora conocimientos aprobados. Borradores de WhatsApp revisados por
      un humano, sin envío automático.
    depende_de:
      - whatsapp_inbox
      - conocimiento_equipo
    expone_a: []
    colecciones_firestore:
      - conversaciones_ia
    rutas_api: []
    integraciones_externas:
      - anthropic_api
    criticidad: media
  formularios:
    area: formularios_publicos
    descripcion: Definiciones de formularios dinámicos (admin construye, público los llena en /f/:slug)
    depende_de: []
    expone_a:
      - solicitudes
    colecciones_firestore:
      - formularios
    rutas_api: []
    integraciones_externas: []
    criticidad: media
  solicitudes:
    area: formularios_publicos
    descripcion: Submissions de formularios públicos. Generan lead/cliente/orden.
    depende_de:
      - formularios
      - clientes
    expone_a:
      - ordenes_servicio
    colecciones_firestore:
      - solicitudes_servicio
    rutas_api: []
    integraciones_externas:
      - firebase_storage
    criticidad: alta
    notas: >-
      Candidata local: solicitud→cliente/orden se convierte con validación transaccional y reuso trazable. Cliente existente se
      verifica; identidad y asignación explícitas. Adjuntos conservan permisos de Storage.
  reportes:
    area: reporting
    descripcion: >-
      Dashboards y métricas: ingresos, conduces emitidos, rendimiento técnicos, proyección de nómina. Dashboard operativo del día
      + Reporte avanzado para análisis comparativos.
    depende_de:
      - ordenes_servicio
      - facturas
      - pagos
      - comisiones
      - personal
      - productos
      - gastos
      - caja
      - nomina
      - ponches
    expone_a: []
    colecciones_firestore:
      - recordatorios_diarios
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: >-
      Candidata local: período mensual/rango RD, fuentes identificables y faltantes visibles. Caja por fecha del pago separada de
      conduces emitidos. Resultado usa nóminas cerradas cuyo período termina en rango, sin prorrateo ni doble comisión; pérdidas
      visibles. Calidad del servicio y NPS no equivalen a calificación individual de secretaria.
  notificaciones:
    area: sistema
    descripcion: Notificaciones internas a empleados (orden asignada, pieza llegó, etc.)
    depende_de:
      - personal
    expone_a: []
    colecciones_firestore:
      - notificaciones
    rutas_api: []
    integraciones_externas: []
    criticidad: media
    notas: Rule gatea por userId == auth.uid. Cazador P-007.
  auditoria:
    area: sistema
    descripcion: Audit log de acciones administrativas sensibles (WhatsApp send, alta de usuarios, etc.)
    depende_de: []
    expone_a: []
    colecciones_firestore:
      - auditoria_admin
      - app_check_audit
      - whatsapp_errores_meta_dedupe
    rutas_api: []
    integraciones_externas: []
    criticidad: media
  rate_limits:
    area: sistema
    descripcion: Contadores diarios por usuario para limitar abuso (WhatsApp send, AI chat, etc.)
    depende_de: []
    expone_a: []
    colecciones_firestore:
      - rate_limits
    rutas_api: []
    integraciones_externas: []
    criticidad: baja
  configuracion:
    area: sistema
    descripcion: Documentos de configuración global (GPS, WhatsApp envío, rate limits, contadores)
    depende_de: []
    expone_a:
      - whatsapp_inbox
      - cotizaciones
      - facturas
    colecciones_firestore:
      - config
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: Contadores OS/QT/CG/FAC viven acá. Cazador P-022.
  conocimiento_equipo:
    area: sistema
    descripcion: Aportes de procedimientos del personal, revisión admin/coordinación y referencias aprobadas para IA.
    depende_de:
      - personal
    expone_a:
      - conversaciones_ia
    colecciones_firestore:
      - conocimiento_equipo
    rutas_api:
      - /api/ai/conocimiento
    integraciones_externas: []
    criticidad: media
    notas: Acceso por API autenticada; cliente Firestore bloqueado por defecto. Pendientes no alimentan IA.
  marketing_meta:
    area: reporting
    descripcion: Panel de campañas Meta Ads de Mister Service; lectura de inversión e interacción.
    depende_de:
      - personal
    expone_a: []
    colecciones_firestore: []
    rutas_api:
      - /api/marketing/resumen
    integraciones_externas:
      - meta_ads
    criticidad: media
    notas: Lectura de anuncios sin escritura; atribución operativa se consulta en seguimiento_marketing y no implica causalidad.
  movimientos_piezas:
    area: inventario
    descripcion: Consumo y movimientos de piezas de reparación
    depende_de:
      - ordenes_servicio
      - productos
    expone_a: []
    colecciones_firestore:
      - movimientos_piezas
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: Colección existente; no confundir con avances de dinero a empleados.
  prestamos_empleados:
    area: personal_rrhh
    descripcion: Préstamos a empleados con cuotas y saldo a recuperar
    depende_de:
      - personal
    expone_a: []
    colecciones_firestore:
      - prestamos_empleados
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: Nómina relee cuotas y saldos en transacción. Distintos de adelantos; la candidata no publica permisos.
  caja:
    area: dinero
    descripcion: Proyección canónica de cobros confirmados, pendientes e incidencias
    depende_de:
      - pagos
      - bancos
    expone_a: []
    colecciones_firestore:
      - ordenes_servicio
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      movimientosCobros.ts proyecta documentos RAW y fecha financiera RD desde orden.pagos. No es una nueva colección ni suma
      espejos; no inventa fechas, métodos o importes faltantes.
  suplidores:
    area: inventario
    descripcion: Directorio de suplidores activos/inactivos y preparación de consultas de piezas por WhatsApp
    depende_de:
      - whatsapp_inbox
    expone_a: []
    colecciones_firestore:
      - suplidores
      - whatsapp_conversaciones
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      suplidores.service.ts y Standby vinculan búsqueda de pieza/foto y suplidor. Envío usa flujo existente y permisos; no envío
      automático agregado.
  seguimiento_chequeo:
    area: clientes
    descripcion: Seguimiento de órdenes de solo chequeo con responsable, próxima gestión y avisos
    depende_de:
      - ordenes_servicio
      - personal
    expone_a: []
    colecciones_firestore:
      - ordenes_servicio
      - notificaciones
      - personal
      - usuarios
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      seguimientoChequeo.service.ts guarda gestión y aviso transaccionales. Conteos por técnico señalan revisión, no prueban
      fraude.
  seguimiento_marketing:
    area: reporting
    descripcion: Consultas, reactivaciones y cobros atribuibles con incidencias visibles
    depende_de:
      - ordenes_servicio
      - caja
      - whatsapp_inbox
    expone_a: []
    colecciones_firestore:
      - ordenes_servicio
      - whatsapp_conversaciones
      - campanas_marketing
    rutas_api: []
    integraciones_externas: []
    criticidad: alta
    notas: >-
      Cohorte de órdenes del período y pagos del mismo período, basada en proyección canónica RAW. Atribución a anuncio no implica
      causalidad. Ambigüedad y fechas ausentes se muestran; no sumar vistas por origen/anuncio. Lectura puntual completa tiene
      límite de escala.
integraciones_externas:
  meta_whatsapp:
    descripcion: Meta Graph API (WhatsApp Business Cloud). Mensajes entrantes (webhook con HMAC) y salientes (send con idempotency).
    criticidad: alta
    notas: WABA 1884486412326904. 2 phone_number_id activos. Tokens y números en Vercel env.
  firebase_auth:
    descripcion: Firebase Authentication (login admin + ID tokens para endpoints api/*)
    criticidad: alta
  firebase_firestore:
    descripcion: Firestore (base de datos principal). Reglas versionadas en firestore.rules + lock.
    criticidad: alta
  firebase_storage:
