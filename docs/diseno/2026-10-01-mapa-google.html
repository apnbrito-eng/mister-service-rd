<title>Mapa Mister Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen map app in the Google Maps idiom — full-bleed map, floating search + chips, left place panel (bottom sheet on phones), layers + zoom controls */
:root{
  color-scheme:light;
  --ink:#1F2937; --ink2:#4B5563; --mute:#6B7280; --line:#E5E7EB; --bg:#FFFFFF; --soft:#F3F4F6;
  --act:#0F3460; --act50:#EFF4FA; --act100:#DCE7F2; --blue:#1A73E8;
  --ok:#15803D; --warn:#B45309; --warnbg:#FEF3C7; --gar:#DC2626;
  --land:#F5F3EF; --land2:#EEEBE5; --water:#AADAFF; --park:#CDE9C4; --road:#FFFFFF; --casing:#DADCE0; --hwy:#FDE293; --hwycase:#F2C14B;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--f);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;background:var(--land)}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;height:100%;width:100%}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--land)}
#map.drag{cursor:grabbing}

/* search + chips */
.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.search{pointer-events:auto;width:min(392px,100%);display:flex;align-items:center;gap:4px;background:#fff;border-radius:24px;box-shadow:var(--sh);height:48px;padding:0 6px 0 16px;position:relative}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:15px;height:100%;background:transparent;color:var(--ink)}
.search .ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.search .ib:hover{background:var(--soft)}
.brand{width:28px;height:28px;border-radius:8px;background:var(--act);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;flex:none;margin-right:4px}
.sugg{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 0;max-height:60vh;overflow:auto}
.sugg button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 16px;min-height:52px;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--soft)}
.sugg .i{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink2)}
.sugg b{display:block;font-weight:600}
.sugg small{color:var(--mute);font-size:12.5px}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#fff;border:0;box-shadow:var(--sh);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--act100);color:var(--act)}
.chip svg{width:16px;height:16px}

/* panel */
.panel{position:absolute;z-index:15;left:0;top:0;bottom:0;width:408px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.panel.closed{transform:translateX(-100%)}
.panel .pin{height:136px;flex:none}
.pbody{overflow:auto;flex:1;padding:4px 0 24px}
.toggle{position:absolute;top:50%;right:-23px;width:23px;height:48px;border:0;border-radius:0 8px 8px 0;background:#fff;box-shadow:2px 0 4px rgba(60,64,67,.2);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sec h3{font-size:15px;font-weight:700;margin:0 0 8px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.acts{display:flex;gap:6px;justify-content:space-between;padding:6px 12px 14px;border-bottom:1px solid var(--line)}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:var(--act);min-height:64px;padding:4px 0;border-radius:12px}
.act:hover{background:var(--soft)}
.act span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--act)}
.act.pri span{background:var(--act);border-color:var(--act);color:#fff}
.act svg{width:18px;height:18px}
.li{display:flex;gap:14px;align-items:flex-start;padding:10px 20px;font-size:14px}
.li svg{width:20px;height:20px;flex:none;color:var(--act);margin-top:1px}
.li small{display:block;color:var(--mute);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.listbtn{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 20px;cursor:pointer;border-bottom:1px solid var(--line);min-height:64px}
.listbtn:hover{background:var(--soft)}
.listbtn b{display:block;font-weight:600;font-size:14.5px}
.listbtn small{display:block;color:var(--mute);font-size:12.5px}
.listbtn .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.back{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink2);margin:-6px 0 0 -10px}
.back:hover{background:var(--soft)}
/* route timeline */
.seg{display:flex;background:var(--soft);border-radius:20px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;min-height:36px;border:0;border-radius:18px;background:transparent;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--act);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tl{list-style:none;margin:0;padding:6px 20px 0}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:8px 0}
.stop .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.stop b{font-weight:600}
.stop small{display:block;color:var(--mute);font-size:12.5px}
.stop .h{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.leg{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;color:var(--ink2);font-size:12.5px;min-height:34px}
.leg i{width:3px;height:30px;margin:0 auto;border-radius:2px;background:repeating-linear-gradient(180deg,var(--blue) 0 5px,transparent 5px 9px)}
.leg span{display:inline-flex;gap:6px;align-items:center}
.leg svg{width:16px;height:16px}
.stop.done .n{opacity:.45}
.stop.done b{color:var(--mute)}
.save{margin:8px 20px 0;padding:10px 12px;border-radius:12px;background:#E8F0FE;color:#174EA6;font-size:13px}
.btn{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--act);font-weight:600;font-size:13.5px;cursor:pointer}
.btn.pri{background:var(--act);border-color:var(--act);color:#fff}

/* controls */
.ctrl{position:absolute;right:12px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cbtn{width:40px;height:40px;border-radius:8px;background:#fff;border:0;box-shadow:var(--sh);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.zoom{display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.zoom button{width:40px;height:40px;border:0;background:#fff;cursor:pointer;font-size:20px;color:var(--ink2)}
.zoom button+button{border-top:1px solid var(--line)}
.layers{position:absolute;left:424px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:12;transition:left .35s cubic-bezier(.22,1,.36,1)}
.panel.closed ~ .layers{left:12px}
.lbtn{width:76px;height:76px;border-radius:10px;border:2px solid #fff;box-shadow:var(--sh);cursor:pointer;padding:0;overflow:hidden;position:relative;background:#6A8F5B}
.lbtn span{position:absolute;left:0;right:0;bottom:4px;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.lpop{position:absolute;bottom:86px;left:0;width:300px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:14px}
.lpop h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mt button{border:2px solid transparent;border-radius:10px;background:var(--soft);padding:8px 4px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.mt button i{width:44px;height:30px;border-radius:6px;display:block}
.mt button[aria-pressed=true]{border-color:var(--blue);color:var(--blue)}
.cap{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer}
.cap input{width:18px;height:18px;accent-color:var(--act)}
.legend{position:absolute;right:64px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:11;background:#fff;border-radius:10px;box-shadow:var(--sh);padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:min(520px,calc(100% - 520px))}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.clock{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:21;background:#fff;border-radius:20px;box-shadow:var(--sh);height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.clock b{font-family:var(--mono);font-weight:500}
.scale{position:absolute;right:64px;top:calc(60px + env(safe-area-inset-top,0px));z-index:11;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.tbtn{margin-left:14px;border:0;background:none;color:#8AB4F8;font:inherit;font-weight:700;cursor:pointer;min-height:32px;padding:0 4px}
.mini{display:block;width:96px;height:5px;border-radius:3px;background:#E2E8F0;overflow:hidden;margin-top:5px}.mini i{display:block;height:100%}
.cand.bl{opacity:.6;cursor:not-allowed}
.warnbox{margin:10px 20px;padding:10px 12px;border-radius:12px;background:var(--warnbg);color:#92400E;font-size:13.5px;font-weight:600}
.warnbox.red{background:#FDE3E3;color:#B91C1C}
.sumbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:600}
.btn.pri{background:var(--act);color:#fff;border-color:var(--act)}
.btn.big{width:100%;min-height:48px;margin-top:14px;font-size:15px;border-radius:24px}
.btn.mot[aria-pressed=true]{background:var(--act50);border-color:var(--act)}
.err{color:#B91C1C;font-size:13px;font-weight:600;margin:8px 0 0}
details.blq summary{padding:12px 20px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);min-height:44px;display:flex;align-items:center}
.att{background:#FFFBEB}.sug{border:1px solid #FCD34D;background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}.sug p{margin:0 0 8px;font-size:13.5px}
.ghost{position:fixed;z-index:80;pointer-events:none;background:#202124;color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;transform:translate(14px,14px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.droptgt{outline:2px dashed var(--act);outline-offset:-4px;background:var(--act50)!important}

@media (min-width:761px){
  .top{left:424px;transition:left .35s cubic-bezier(.22,1,.36,1)}
  .panel.closed ~ .top{left:12px}
  .panel .ph{height:68px;flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 20px;border-bottom:1px solid var(--line)}.ph b{font-size:17px}.ph span{font-size:12.5px;color:var(--mute)}
}
@media (max-width:760px){
  .panel{top:auto;width:100%;height:46%;border-radius:16px 16px 0 0;transition:height .35s cubic-bezier(.22,1,.36,1)}
  .panel.closed{transform:none;height:96px}
  .panel.tall{height:84%}
  .panel .ph{display:none}
  .grab{display:block!important}
  .toggle{display:none}
  .layers{left:12px!important;bottom:auto;top:calc(116px + env(safe-area-inset-top,0px))}
  .lbtn{width:52px;height:52px}
  .lbtn span{font-size:10px}
  .lpop{bottom:auto;top:60px}
  .ctrl{bottom:auto;top:calc(116px + env(safe-area-inset-top,0px))}
  .legend,.scale{display:none}
  .clock{display:none}
}
.grab{display:none;border:0;background:transparent;width:100%;height:28px;cursor:pointer;flex:none}
.grab i{display:block;width:36px;height:4px;border-radius:2px;background:#DADCE0;margin:10px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <svg id="map" role="img" aria-label="Mapa de Santo Domingo con clientes, citas y vans"></svg>

  <aside class="panel" id="panel" aria-label="Panel de información">
    <div class="ph"><b>Mapa</b><span>Clientes, citas, rutas y vans · jueves 1 oct</span></div>
    <button class="grab" id="grab" type="button" aria-label="Expandir panel"><i></i></button>
    <div class="pbody" id="pbody"></div>
    <button class="toggle" id="toggle" type="button" aria-label="Ocultar panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button>
  </aside>

  <div class="top">
    <div class="search" role="search">
      <span class="brand" aria-hidden="true">MS</span>
      <label for="q" style="position:absolute;left:-9999px">Buscar</label>
      <input id="q" autocomplete="off" placeholder="Buscar cliente, orden, sector o dirección" aria-autocomplete="list" aria-controls="sugg">
      <button class="ib" type="button" id="clear" aria-label="Limpiar búsqueda" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="ib" type="button" id="goRoute" aria-label="Rutas de hoy"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><path d="M12 2l9 10-9 10-9-10z"/><path d="M9 14v-2a2 2 0 012-2h4M13 8l2 2-2 2"/></svg></button>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Mostrar en el mapa"></div>
  </div>

  <div class="clock" aria-live="off"><span>Hoy</span><b id="clock">11:20</b><button class="ib" type="button" id="play" aria-label="Avanzar el día" style="width:28px;height:28px;border:0;background:var(--soft);border-radius:50%;cursor:pointer">▶</button></div>

  <div class="layers">
    <button class="lbtn" id="lbtn" type="button" aria-expanded="false" aria-controls="lpop"><svg viewBox="0 0 76 76" width="100%" height="100%"><rect width="76" height="76" fill="#5E7F4E"/><path d="M0 50 Q30 40 76 56 V76 H0z" fill="#3E6A8A"/><path d="M10 0 L30 76" stroke="#C9C2A8" stroke-width="3"/><path d="M0 30 L76 22" stroke="#C9C2A8" stroke-width="2"/></svg><span>Capas</span></button>
    <div class="lpop" id="lpop" hidden>
      <h4>Tipo de mapa</h4>
      <div class="mt" id="mt">
        <button type="button" data-t="mapa" aria-pressed="true"><i style="background:linear-gradient(135deg,#F5F3EF 50%,#AADAFF 50%)"></i>Mapa</button>
        <button type="button" data-t="satelite" aria-pressed="false"><i style="background:linear-gradient(135deg,#55704A,#2F4B5F)"></i>Satélite</button>
        <button type="button" data-t="trafico" aria-pressed="false"><i style="background:linear-gradient(90deg,#1E8E3E 33%,#F9AB00 33% 66%,#D93025 66%)"></i>Tráfico</button>
      </div>
      <h4>Detalles del mapa</h4>
      <label class="cap"><input type="checkbox" id="cCal">Calor de clientes</label>
      <label class="cap"><input type="checkbox" id="cZon">Zonas de cada técnico</label>
      <label class="cap"><input type="checkbox" id="cNom" checked>Nombres de calles</label>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="scale" id="scale"></div>
  <div class="ctrl">
    <button class="cbtn" type="button" id="me" aria-label="Centrar en la oficina"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div class="zoom"><button type="button" id="zin" aria-label="Acercar">+</button><button type="button" id="zout" aria-label="Alejar">−</button></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
/* ============ DATOS DE EJEMPLO ============ */
let seed=5; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}; const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const SEC={'Los Prados':[18.478,-69.951],'Naco':[18.474,-69.928],'Piantini':[18.467,-69.937],'Bella Vista':[18.455,-69.941],'Gazcue':[18.465,-69.902],'Zona Colonial':[18.473,-69.884],'Arroyo Hondo':[18.503,-69.943],'Mirador Norte':[18.445,-69.958],'Cristo Rey':[18.493,-69.928],'Los Ríos':[18.497,-69.965],'Herrera':[18.474,-70.003],'Los Alcarrizos':[18.516,-70.012],'Pedro Brand':[18.566,-70.093],'Haina':[18.416,-70.033],'Manoguayabo':[18.487,-70.040],'Villa Mella':[18.555,-69.912],'Sabana Perdida':[18.540,-69.870],'Los Mina':[18.496,-69.857],'Ensanche Ozama':[18.482,-69.875],'Charles de Gaulle':[18.513,-69.846],'San Isidro':[18.502,-69.775],'Villa Faro':[18.480,-69.822]};
const PESO={'Naco':46,'Arroyo Hondo':44,'Los Prados':40,'Piantini':38,'Herrera':36,'Bella Vista':34,'Villa Mella':32,'Los Alcarrizos':30,'Los Mina':30,'Mirador Norte':26,'Manoguayabo':24,'Ensanche Ozama':24,'Gazcue':22,'Charles de Gaulle':22,'Cristo Rey':20,'Los Ríos':18,'Villa Faro':18,'Sabana Perdida':16,'Pedro Brand':14,'San Isidro':14,'Haina':12,'Zona Colonial':10};
const CALLES=['Calle 3ra','Calle Interior A','Av. Principal','Calle 7','Calle Respaldo 2','Calle El Sol','Calle 14','Calle Los Pinos','Calle Duarte','Calle Primera'];
const NOM=['Ana','Luis','Carmen','José','Rosa','Pedro','Marta','Juan','Elena','Rafael','Sonia','Héctor','Iris','Daniel','Paola','Tomás','Yahaira','Leonela','Génesis','Berkys','Altagracia','Keyton','Eneris','Diomir','Albania','Santty'];
const APE=['Rodríguez','Peña','Vidal','Medina','Fermín','Guzmán','López','Castillo','Santos','Díaz','Báez','Tavárez','Núñez','Ortiz','Encarnación','Almonte'];
const EQ=['Lavadora','Nevera','Aire','Estufa','Secadora'];
const MARCA={Lavadora:['Samsung','LG','Whirlpool'],Nevera:['LG','Frigidaire','Samsung'],Aire:['Gree','LG','Midea'],Estufa:['Mabe','Frigidaire'],Secadora:['Whirlpool','Mabe']};
const CL=[]; let cid=1;

  const tagC={'c-ok':'background:#DCFCE7;color:#166534','c-a':'background:var(--act50);color:var(--act)','c-w':'background:var(--warnbg);color:#92400E','c-n':'background:var(--soft);color:var(--ink2)'}[estTxt[0]];
  return `<div class="sec">${backBtn()}<p class="muted mono">${x.id}</p><h2>${c.n}</h2><p class="muted" style="margin-top:2px">${c.eq} ${c.marca} · ${x.falla}</p><div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><span class="tag" style="${tagC}">${estTxt[1]}</span>${x.gar?'<span class="tag" style="background:#FDE3E3;color:#B91C1C">Garantía</span>':''}${ts.tarde?`<span class="tag" style="background:var(--warnbg);color:#92400E">Llega ${ts.tarde} min tarde</span>`:''}</div></div>
  <div class="acts"><button class="act pri" type="button" data-ruta="${x.t}"><span>${ic('car')}</span>Ver ruta</button><button class="act" type="button" data-a="wa"><span>${ic('wa')}</span>Avisar</button><button class="act" type="button" data-a="editar"><span>${ic('edit')}</span>Editar</button><button class="act" type="button" data-reasignar="${x.id}"><span>${ic('swap')}</span>Reasignar</button></div>
  <div class="li">${ic('clock')}<div>${hh(x.h)} · llega ${fmtMin(ts.lleg)}<small>Sale ${fmtMin(ts.sale)} · ${Math.round(ts.km)} km · ${ts.m} min de viaje</small></div></div>
  <div class="li">${ic('user')}<div>${t.n} · Equipo ${t.eq}<small>Cita ${citasRuta(x.t).indexOf(x)+1} de ${citasDe(x.t).length} de su día</small></div></div>
  <div class="li">${ic('pin')}<div>${c.dir}</div></div>`;
}
function ruta(ti){
  const t=TEC[ti],ts=tiempos(ti);const km=ts.reduce((a,s)=>a+s.km,0),min=ts.reduce((a,s)=>a+s.m,0);
  let h=`<div class="sec">${backBtn()}<div class="row"><span class="av" style="background:${t.c}">${t.n[0]}</span><div><h2 style="font-size:20px">Ruta de ${t.n}</h2><p class="muted">Equipo ${t.eq} · ${ts.length} citas</p></div></div>
  <p style="margin-top:12px;font-size:20px;font-weight:700;color:var(--ok)">${Math.floor(min/60)} h ${min%60} min <span style="color:var(--mute);font-size:15px;font-weight:500">(${Math.round(km)} km)</span></p><p class="muted">Tiempo de manejo estimado con el tráfico de hoy</p>
  <div class="seg" role="group" aria-label="Orden de la ruta"><button type="button" data-rm="agenda" aria-pressed="${rutaModo==='agenda'}">Orden de la agenda</button><button type="button" data-rm="corta" aria-pressed="${rutaModo==='corta'}">Sugerir más corta</button></div></div>`;
  if(rutaModo==='corta'){const kmA=(()=>{let p=OFICINA,k=0;citasDe(ti).forEach(x=>{k+=kmR(p,pos(x.c));p=pos(x.c);});return k;})();const ah=kmA-km,tard=ts.filter(s=>s.tarde>10).length;
    h+=ah<0.5?`<div class="save">El orden de la agenda ya es el más corto. No hay nada que ahorrar.</div>`:`<div class="save">Ahorra ${ah.toFixed(1)} km.${tard?` Pero llegaría tarde a ${tard} cita${tard>1?'s':''}: habría que llamar a ${tard>1?'esos clientes':'ese cliente'} para cambiar la hora antes de usar este orden.`:' Todas las citas se cumplen a su hora.'}</div>`;}
  h+=`<ol class="tl"><li class="stop"><span class="n" style="background:var(--act)">MS</span><div><b>Oficina</b><small>Salida</small></div><span class="h">${fmtMin(ts[0]?.sale??510)}</span></li>`;
  ts.forEach((s,i)=>{const est=estadoCita(s.x);h+=`<li class="leg"><i></i><span>${ic('car')} ${s.m} min · ${s.km.toFixed(1)} km${est==='en_camino'?' · <b style="color:var(--warn)">en camino ahora</b>':''}</span></li>
    <li class="stop ${est==='hecha'?'done':''}"><span class="n" style="background:${s.x.gar?'var(--gar)':t.c}">${est==='hecha'?'✓':i+1}</span><div><button type="button" data-cita-open="${s.x.id}" style="border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit"><b>${s.x.c.n}</b></button><small>${s.x.c.eq} · ${s.x.c.s}${s.x.gar?' · garantía':''}</small>${s.tarde?`<small style="color:var(--warn);font-weight:600">Llega ${s.tarde} min después de la hora</small>`:''}</div><span class="h">${hh(s.x.h)}</span></li>`;});
  h+=`</ol><div class="sec" style="border-top:1px solid var(--line);margin-top:8px"><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" type="button" data-a="enviarRuta">Enviar ruta al técnico</button><button class="btn" type="button" data-a="gmaps">Abrir en Google Maps</button><button class="btn" type="button" data-repartir="${ti}">Repartir su día</button></div></div>`;
  return h;
}
function grupo(ids){const cs=ids.map(id=>CL.find(c=>c.id===id));const fr=cs.filter(c=>c.meses>=12).length;
  return `<div class="sec">${backBtn()}<h2>${cs.length} clientes aquí</h2><p class="muted">${fr} fríos · acerca el mapa para separarlos</p></div>`+cs.slice(0,30).map(c=>{const [col,t]=ANT(c.meses);return `<button class="listbtn" type="button" data-cli-open="${c.id}"><i class="dot" style="background:${col};width:12px;height:12px"></i><div><b>${c.n}</b><small>${c.eq} · ${c.s} · ${t}</small></div></button>`;}).join('');}
function van(ti){const t=TEC[ti],v=vanPos(ti);return `<div class="sec">${backBtn()}<div class="row"><span class="av" style="background:${t.c}">${ic('van').replace('<svg','<svg width="18" height="18"')}</span><div><h2 style="font-size:20px">${t.n}</h2><p class="muted">VAN · Equipo ${t.eq}</p></div></div><p style="margin-top:12px;font-size:16px;font-weight:600">${v.estado}${v.eta?` · llega en ${v.eta} min`:''}</p><p class="muted">Última señal hace 1 min · 32 km/h</p></div>
  <div class="acts"><button class="act pri" type="button" data-ruta="${ti}"><span>${ic('car')}</span>Ver ruta</button><button class="act" type="button" data-a="tel"><span>${ic('tel')}</span>Llamar</button><button class="act" type="button" data-repartir="${ti}"><span>${ic('swap')}</span>Repartir</button></div>${v.x?`<div class="li">${ic('pin')}<div>Próxima: ${v.x.c.n}<small>${v.x.c.dir} · ${hh(v.x.h)}</small></div></div>`:''}`;}

/* ============ CHIPS ============ */
const CH=[['clientes','Clientes','user'],['citas','Citas de hoy','clock'],['rutas','Rutas','car'],['gps','Vans en vivo','van'],['frios','Clientes fríos','user'],['garantias','Garantías','tool']];
function chips(){document.getElementById('chips').innerHTML=CH.map(([k,t,i])=>`<button class="chip" type="button" data-chip="${k}" aria-pressed="${capa[k]}">${ic(i)}${t}</button>`).join('')+`<label class="chip" style="gap:4px"><span style="position:absolute;left:-9999px">Técnico</span><select id="ftec" style="border:0;background:transparent;font:inherit;font-weight:600;color:inherit;height:30px"><option value="">Todos los técnicos</option><option value="A">Equipo A · Wila</option><option value="B">Equipo B · Yohana</option>${TEC.map((t,i)=>`<option value="${i}">${t.n}</option>`).join('')}</select></label>`;
  const f=document.getElementById('ftec');f.value=filtroTec===null?'':String(filtroTec);f.onchange=e=>{const v=e.target.value;filtroTec=v===''?null:(v==='A'||v==='B')?null:+v;if(v==='A'||v==='B'){teamF=v;}else teamF=null;draw();};}

/* ============ EVENTOS ============ */
function toast(m,acc){const e=document.getElementById('toast');e.textContent=m;if(acc){const b=document.createElement('button');b.type='button';b.className='tbtn';b.textContent=acc.t;b.onclick=()=>{acc.f();e.classList.remove('on');};e.append(b);}e.style.pointerEvents=acc?'auto':'none';e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),acc?10000:3000);}
function aplicar(movs,txt){const antes=movs.map(([x])=>[x,x.t]);movs.forEach(([x,ti])=>{x.t=ti;});hist.length=0;vista=movs.length===1?{t:'cita',id:movs[0][0].id}:{t:'inicio'};motivo='';render();
  toast(txt,{t:'Deshacer',f:()=>{antes.forEach(([x,ti])=>{x.t=ti;});hist.length=0;vista=movs.length===1?{t:'cita',id:movs[0][0].id}:{t:'inicio'};render();toast('Se deshizo el cambio.');}});}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('[data-chip]');if(!b)return;const k=b.dataset.chip;capa[k]=!capa[k];if(k==='frios'&&capa.frios)capa.clientes=false;if(k==='clientes'&&capa.clientes)capa.frios=false;chips();draw();if(k==='gps'&&capa.gps)toast('Las vans se mueven según la hora. Usa ▶ para avanzar el día.');});
pb.addEventListener('click',e=>{
  if(e.target.closest('[data-back]')){back();return;}
  const r=e.target.closest('[data-ruta]');if(r){rutaTec=+r.dataset.ruta;go({t:'ruta',ti:+r.dataset.ruta});const cs=citasDe(+r.dataset.ruta);const la=cs.reduce((a,x)=>a+x.c.la,OFICINA[0])/(cs.length+1),lo=cs.reduce((a,x)=>a+x.c.lo,OFICINA[1])/(cs.length+1);flyTo(la,lo,2.2);return;}
  const co=e.target.closest('[data-cita-open]');if(co){const x=CITAS.find(z=>z.id===co.dataset.citaOpen);go({t:'cita',id:x.id});flyTo(x.c.la,x.c.lo);return;}
  const cl=e.target.closest('[data-cli-open]');if(cl){const c=CL.find(z=>z.id===cl.dataset.cliOpen);go({t:'cliente',id:c.id});flyTo(c.la,c.lo,5);return;}
  const ra=e.target.closest('[data-reasignar]');if(ra){motivo='';go({t:'reasignar',id:ra.dataset.reasignar});return;}
  const el_=e.target.closest('[data-elegir]');if(el_){motivo='';go({t:'confirmar',id:vista.id,ti:+el_.dataset.elegir});return;}
  const sg=e.target.closest('[data-sug]');if(sg){motivo='Va atrasado';go({t:'confirmar',id:sg.dataset.sug,ti:+sg.dataset.sugti});return;}
  const mo=e.target.closest('[data-mot]');if(mo){motivo=mo.dataset.mot;pb.querySelectorAll('[data-mot]').forEach(b=>b.setAttribute('aria-pressed',b===mo));document.getElementById('merr').hidden=true;return;}
  const cf=e.target.closest('[data-confirmar]');if(cf){if(cf.dataset.req==='true'&&!motivo){document.getElementById('merr').hidden=false;return;}cf.disabled=true;cf.textContent='Guardando…';const x=CITAS.find(z=>z.id===vista.id),ti=+cf.dataset.confirmar;
    setTimeout(()=>aplicar([[x,ti]],`Listo: ${x.id} ahora es de ${TEC[ti].n}. Avísale por WhatsApp.`),450);return;}
  const rp=e.target.closest('[data-repartir]');if(rp){go({t:'repartir',ti:+rp.dataset.repartir});return;}
  const rc=e.target.closest('[data-repconf]');if(rc){const plan=planRepartir(+rc.dataset.repconf).filter(p=>p.c);aplicar(plan.map(p=>[p.x,p.c.ti]),`Se pasaron ${plan.length} citas de ${TEC[+rc.dataset.repconf].n}.`);return;}
  const rm=e.target.closest('[data-rm]');if(rm){rutaModo=rm.dataset.rm;render();return;}
  const cp=e.target.closest('[data-capa]');if(cp){capa[cp.dataset.capa]=true;if(cp.dataset.capa==='frios')capa.clientes=false;chips();draw();return;}
  const a=e.target.closest('[data-a]');if(a){const m={orden:'Abriría «Nueva orden» con el cliente y su ubicación ya puestos.',dir:'Abriría Google Maps con la ruta desde la oficina o desde la van.',wa:'Abriría la conversación en Conversaciones con un texto listo (no se envía solo).',tel:'Mostraría el número para llamar.',share:'Copiaría el enlace de ubicación para enviárselo al técnico.',mover:'Podrías arrastrar el pin para corregir la ubicación y guardarla en la ficha.',editar:'Abriría el mismo formulario de edición que hoy usa Mapa de Rutas.',reasignar:'Mostraría los técnicos de la misma especialidad libres a esa hora, el más cercano primero.',enviarRuta:'Enviaría al técnico por WhatsApp su lista de citas en orden con los enlaces de cada dirección.',gmaps:'Abriría Google Maps con todas las paradas en orden (hasta 10).'}[a.dataset.a];toast(m);}
});
// mapa: click, arrastre, zoom
let drag=null,moved=false;
let arr=null;const ghost=document.createElement('div');ghost.className='ghost';ghost.hidden=true;document.body.append(ghost);
function dropList(x){const cs=candidatos(x);return `<div class="sec"><h2 style="font-size:20px">Suelta sobre un técnico</h2><p class="muted" style="margin-top:4px">${x.c.n} · ${hh(x.h)}. Los primeros llegan a tiempo y quedan más cerca. Suelta fuera para cancelar.</p></div>`+cs.map(c=>filaCand(c,'data-drop')).join('');}
svg.addEventListener('pointerdown',e=>{const ct=e.target.closest&&e.target.closest('[data-cita]');
  if(ct&&e.pointerType==='mouse'&&innerWidth>760){const x=CITAS.find(z=>z.id===ct.dataset.cita);if(['pendiente','en_camino'].includes(estadoCita(x))){arr={x,sx:e.clientX,sy:e.clientY,on:false};svg.setPointerCapture(e.pointerId);return;}}
  drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;svg.setPointerCapture(e.pointerId);svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{if(!arr)return;if(!arr.on&&Math.abs(e.clientX-arr.sx)+Math.abs(e.clientY-arr.sy)>6){arr.on=true;ghost.textContent=`${arr.x.id} · ${arr.x.c.n}`;ghost.hidden=false;pb.innerHTML=dropList(arr.x);if(panelClosed)document.getElementById('toggle').click();}
  if(!arr.on)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.droptgt').forEach(d=>d.classList.remove('droptgt'));const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(t&&!t.disabled)t.classList.add('droptgt');},true);
svg.addEventListener('pointerup',e=>{if(!arr)return;const a=arr;arr=null;ghost.hidden=true;e.stopImmediatePropagation();
  if(!a.on){go({t:'cita',id:a.x.id});return;}
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');const ti=t&&!t.disabled?+t.dataset.drop:null;
  if(ti===null||ti===a.x.t){render();toast(ti===a.x.t?'Esa cita ya es de ese técnico.':'Se canceló: suelta la cita sobre un técnico disponible.');return;}
  motivo='';hist.push(vista);vista={t:'confirmar',id:a.x.id,ti};render();},true);
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;view.x=drag.vx-dx/view.k;view.y=drag.vy-dy/view.k;setVB();});
svg.addEventListener('pointerup',e=>{svg.classList.remove('drag');const d=drag;drag=null;if(moved){draw();return;}
  const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.hit');if(!el){if(vista.t!=='inicio'){hist.length=0;vista={t:'inicio'};render();}return;}
  if(el.dataset.cita){go({t:'cita',id:el.dataset.cita});}
  else if(el.dataset.cli){go({t:'cliente',id:el.dataset.cli});}
  else if(el.dataset.van){go({t:'van',ti:+el.dataset.van});}
  else if(el.dataset.cl){const [x,y]=el.dataset.cl.split(',').map(Number);const cell=46/view.k;const ids=cliVis().filter(c=>{const [cx,cy]=P(c.la,c.lo);return Math.abs(cx-x)<cell&&Math.abs(cy-y)<cell;}).map(c=>c.id);const r=svg.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top);go({t:'grupo',ids});}
});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.4,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.4,r.width/2,r.height/2);};
document.getElementById('me').onclick=()=>flyTo(...OFICINA,2.6);
// panel
const panel=document.getElementById('panel');
document.getElementById('toggle').onclick=()=>{panelClosed=!panelClosed;panel.classList.toggle('closed',panelClosed);document.getElementById('toggle').setAttribute('aria-label',panelClosed?'Mostrar panel':'Ocultar panel');document.getElementById('toggle').innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="${panelClosed?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg>`;setTimeout(draw,360);};
document.getElementById('grab').onclick=()=>{if(panel.classList.contains('tall')){panel.classList.remove('tall');panel.classList.add('closed');}else if(panel.classList.contains('closed')){panel.classList.remove('closed');}else panel.classList.add('tall');};
// capas
const lbtn=document.getElementById('lbtn'),lpop=document.getElementById('lpop');
lbtn.onclick=()=>{lpop.hidden=!lpop.hidden;lbtn.setAttribute('aria-expanded',String(!lpop.hidden));};
document.getElementById('mt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tipo=b.dataset.t;document.querySelectorAll('#mt button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
document.getElementById('cCal').onchange=e=>{calor=e.target.checked;draw();};
document.getElementById('cZon').onchange=e=>{zonasTec=e.target.checked;draw();};
document.getElementById('cNom').onchange=e=>{nombres=e.target.checked;draw();};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!lpop.hidden){lpop.hidden=true;return;}if(!sugg.hidden){sugg.hidden=true;return;}if(vista.t!=='inicio')back();}});
// búsqueda
const q=document.getElementById('q'),sugg=document.getElementById('sugg'),clr=document.getElementById('clear');
function buscar(){const v=q.value.trim().toLowerCase();clr.hidden=!v;if(!v){sugg.hidden=true;return;}
  const res=[...Object.keys(SEC).filter(s=>s.toLowerCase().includes(v)).slice(0,3).map(s=>({k:'sec',s,t:s,d:`Sector · ${CL.filter(c=>c.s===s).length} clientes`,i:'pin'})),
    ...CITAS.filter(x=>x.id.toLowerCase().includes(v)||x.c.n.toLowerCase().includes(v)).slice(0,4).map(x=>({k:'cita',id:x.id,t:`${x.id} · ${x.c.n}`,d:`Cita hoy ${hh(x.h)} · ${TEC[x.t].n}`,i:'clock'})),
    ...CL.filter(c=>c.n.toLowerCase().includes(v)||c.tel.includes(v)||c.dir.toLowerCase().includes(v)).slice(0,6).map(c=>({k:'cli',id:c.id,t:c.n,d:`${c.dir}`,i:'user'})),
    ...TEC.map((t,i)=>({t,i})).filter(o=>o.t.n.toLowerCase().includes(v)).map(o=>({k:'tec',i:o.i,t:`Ruta de ${o.t.n}`,d:`Equipo ${o.t.eq}`,i2:1,i:'car',ti:o.i}))];
  sugg.innerHTML=res.length?res.map((r,j)=>`<button type="button" role="option" data-j="${j}"><span class="i">${ic(r.i)}</span><div><b>${r.t}</b><small>${r.d}</small></div></button>`).join(''):'<div style="padding:14px 16px" class="muted">Sin resultados. Prueba con el nombre, el teléfono, el número de orden o el sector.</div>';
  sugg.hidden=false; sugg._res=res;}
q.addEventListener('input',buscar);q.addEventListener('focus',buscar);
clr.onclick=()=>{q.value='';buscar();q.focus();};
sugg.addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;const r=sugg._res[+b.dataset.j];sugg.hidden=true;q.value=r.t;
  if(r.k==='sec'){flyTo(...SEC[r.s],3.4);}
  if(r.k==='cli'){const c=CL.find(z=>z.id===r.id);go({t:'cliente',id:c.id});flyTo(c.la,c.lo,5);}
  if(r.k==='cita'){const x=CITAS.find(z=>z.id===r.id);go({t:'cita',id:x.id});flyTo(x.c.la,x.c.lo,4);}
  if(r.k==='tec'){rutaTec=r.ti;go({t:'ruta',ti:r.ti});flyTo(...OFICINA,1.8);}});
document.getElementById('goRoute').onclick=()=>{hist.length=0;vista={t:'inicio'};render();capa.rutas=true;chips();draw();toast('Rutas de hoy de todos los técnicos. Toca uno en el panel para ver su recorrido.');};
// reloj
let timer=null;const clk=document.getElementById('clock');
document.getElementById('play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='▶';return;}e.target.textContent='❚❚';capa.gps=true;chips();timer=setInterval(()=>{ahora+=4;if(ahora>18*60){ahora=8*60+30;}clk.textContent=fmtMin(ahora);render();},matchMedia('(prefers-reduced-motion: reduce)').matches?800:220);};
addEventListener('resize',()=>{draw();});
chips(); fit(); render();
})();
