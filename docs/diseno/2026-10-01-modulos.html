<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — solid sidebar grouped by area, one module at a time; list → detail where the module has records */
:root{
  color-scheme:light;
  --bg:#F0F4F8; --card:#FFFFFF; --ink:#111827; --ink2:#4B5563; --mute:#6B7280; --line:#E5E7EB; --track:#EDF1F6; --side:#FFFFFF;
  --act:#0F3460; --act-50:#EFF4FA; --act-100:#DCE7F2; --brand:#4A6FA5;
  --gar:#DC2626; --warn:#B45309; --ok:#15803D;
  --p0:#C9D8EA; --p1:#9DB7D6; --p2:#7697C4; --p3:#4A6FA5; --p4:#2F4E7E; --p5:#0F3460; --p6:#15803D;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{margin:0;letter-spacing:-.02em}
p{margin:0}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
aside.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--act);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{display:block;font-size:15px}.brand small{color:var(--mute);font-size:12px}
.grp{margin-top:14px}
.grp h4{margin:0 0 4px;padding:0 10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--bg)}
.nav a[aria-current=page]{background:var(--act-50);color:var(--act);font-weight:700}
.nav a .b{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--act);color:#fff;border-radius:999px;padding:1px 7px}
.nav a .b.w{background:#FEF3C7;color:#92400E}
.ico{width:18px;height:18px;flex:none}
.mobnav{display:none}

main{min-width:0;padding:22px 28px 40px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;font-weight:700;line-height:36px}
.head .sub{color:var(--mute);font-size:14px;width:100%;margin-top:-10px}
.head .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid #CBD2DC;border-radius:8px;background:#fff;padding:0 12px;min-width:240px;color:var(--mute)}
.search input{border:0;outline:0;font-size:15px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--act);background:var(--act);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:#fff;color:var(--act);border-color:#CBD2DC}
.btn:active{transform:scale(.97)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{display:block;color:var(--mute);font-size:12.5px;font-weight:500}
.kpi strong{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink2)}
.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.h3 span{font-weight:500;color:var(--mute);font-size:13px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;text-align:left;width:100%;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:#F8FAFC}
.row[aria-selected=true]{background:var(--act-50)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--act);background:var(--act-100);flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{text-align:right;flex:none;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cnt{background:var(--act);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 8px;border-radius:999px;white-space:nowrap}
.c-n{background:#F3F4F6;color:#374151}.c-a{background:var(--act-50);color:var(--act)}.c-w{background:#FEF3C7;color:#92400E}.c-ok{background:#DCFCE7;color:#166534}.c-r{background:#FDE3E3;color:#B91C1C}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow .7s var(--spring) both}
@keyframes grow{from{transform:scaleX(0)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500;text-align:right}
.bub{max-width:72%;padding:8px 12px;border-radius:14px;margin:6px 0;font-size:14px}
.bub.in{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.out{background:var(--act-50);margin-left:auto;border-bottom-right-radius:4px}
.bub small{display:block;font-size:11px;color:var(--mute);margin-top:2px;text-align:right}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.colm{background:#E9EEF4;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:340px}
.colm h3{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;padding:2px 4px 4px}
.colm h3 span{color:var(--mute);font-family:var(--mono);font-weight:500}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.tk b{display:block;font-size:14px}
.tk small{color:var(--mute);display:block}
.tk .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;background:var(--act);border:3px solid var(--act-100);margin-top:3px;z-index:1}
.tl b{display:block;font-weight:600}.tl small{color:var(--ink2);font-size:13px}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eq div{border:1px solid var(--line);border-radius:12px;padding:12px}
.eq b{display:block}.eq small{color:var(--mute);font-size:12.5px}
.empty{color:var(--mute)}
.fade{animation:fade .35s var(--spring)}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}.eq{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside.side{display:none}
  .mobnav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .mobnav a{flex:none;min-height:40px;display:flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);text-decoration:none;font-weight:600;font-size:13.5px}
  .mobnav a[aria-current=page]{background:var(--act);color:#fff;border-color:var(--act)}
  main{padding:18px 16px 40px}
  .search{min-width:0;flex:1}
  .head h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- router ---------- */
const flat=MODS.flatMap(g=>g[1]);
function navHTML(cur){return MODS.map(g=>`<div class="grp"><h4>${g[0]}</h4>${g[1].map(m=>`<a href="#${m[0]}" ${m[0]===cur?'aria-current="page"':''}>${ico(m[2])}${m[1]}${m[3]?`<span class="b ${m[3].endsWith('w')?'w':''}">${parseInt(m[3])}</span>`:''}</a>`).join('')}</div>`).join('');}
function go(){
  let k=(location.hash||'').slice(1); if(!V[k]) k='conversaciones';
  document.getElementById('nav').innerHTML=navHTML(k);
  document.getElementById('mobnav').innerHTML=flat.map(m=>`<a href="#${m[0]}" ${m[0]===k?'aria-current="page"':''}>${m[1]}</a>`).join('');
  const main=document.getElementById('main'); main.innerHTML=`<div class="fade">${V[k]()}</div>`;
  main.querySelectorAll('.list').forEach(l=>l.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;l.querySelectorAll('.row').forEach(x=>x.setAttribute('aria-selected',x===r));}));
  const q=document.getElementById('q'); if(q) q.addEventListener('input',()=>{const v=q.value.toLowerCase();main.querySelectorAll('.list .row, tbody tr').forEach(r=>{r.hidden=v&&!r.textContent.toLowerCase().includes(v)})});
  const cur=document.querySelector('.mobnav a[aria-current]'); if(cur) cur.scrollIntoView({inline:'center',block:'nearest'});
}
addEventListener('hashchange',()=>{go();scrollTo(0,0)}); go();
})();
